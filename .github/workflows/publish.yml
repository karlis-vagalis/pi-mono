name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a release tag such as v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Set versions from Git
        id: versions
        run: just version-set
      - run: bun run build
      - name: Pack publishable workspaces
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-packages"
          for manifest in extensions/*/package.json; do
            if [[ "$(jq -r '.private // false' "$manifest")" == true ]]; then
              continue
            fi
            # Multiple tags on one commit must not silently stamp the wrong version.
            test "$(jq -r '.version' "$manifest")" = "${RELEASE_TAG#v}"
            (
              cd "$(dirname "$manifest")"
              bun pm pack --ignore-scripts --destination "$RUNNER_TEMP/npm-packages"
            )
          done
      - name: Reset source versions
        if: ${{ always() && (steps.versions.outcome == 'success' || steps.versions.outcome == 'failure') }}
        run: just version-reset
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.repository == 'karlis-vagalis/pi-mono'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm-packages
      - name: Publish tarballs with npm trusted publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          dist_tag=latest
          if [[ "${RELEASE_TAG#v}" == *-* ]]; then
            dist_tag=next
          fi
          for tarball in npm-packages/*.tgz; do
            name="$(tar -xOf "$tarball" package/package.json | jq -r '.name')"
            version="$(tar -xOf "$tarball" package/package.json | jq -r '.version')"
            test "$version" = "${RELEASE_TAG#v}"
            # Retry partial releases without attempting to overwrite immutable versions.
            status="$(curl --silent --show-error --location --retry 3 --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/${name/\//%2F}/$version")"
            case "$status" in
              200) echo "Already published: $name@$version"; continue ;;
              404) ;;
              *) echo "Registry lookup failed ($status): $name@$version" >&2; exit 1 ;;
            esac
            npm publish "./$tarball" --access public --provenance --ignore-scripts --tag "$dist_tag"
          done
